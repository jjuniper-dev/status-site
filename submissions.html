<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Submissions</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="submissions">
<div id="nav-container"></div>
<div class="layout">
  <div class="main-content">
    <div class="breadcrumb">Dashboard &gt; Submissions</div>
    <div class="section-label">Evaluated Submissions</div>
    <div id="submissions-list" class="grid-2"></div>
  </div>
</div>
<script>
  fetch('/status-site/components/nav.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('nav-container').innerHTML = html;
      document.querySelector('.topnav-link[data-page=\"submissions\"]')?.classList.add('active');
    });

  const container = document.getElementById('submissions-list');
  fetch('/status-site/data/submissions.json')
    .then(r => r.ok ? r.json() : { submissions: [] })
    .then(payload => {
      const submissions = payload.submissions || [];
      container.innerHTML = submissions.length
        ? submissions.map(s => `<div class="card"><div class="card-title">${s.title || s.submission_id}</div><ul class="card-list"><li>ID: ${s.submission_id}</li><li>Owner: ${s.owner || 'n/a'}</li><li>Created: ${s.created_at || 'n/a'}</li></ul></div>`).join('')
        : '<div class="card"><div class="card-title">No submissions exported</div></div>';
    });
</script>
</body>
</html>
