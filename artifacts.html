<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA Artifacts — Status Site</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--teal:#00C8C8;--bg:#07090F;--bg2:#0D1117;--bg3:#131920;--border:rgba(255,255,255,0.10);--text:#F0F4FA;--text-dim:#B0BFCF;--text-faint:#6A7D90;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--cond:'IBM Plex Sans Condensed',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;max-width:1100px;width:100%;margin:0 auto;padding:28px 40px 64px}
@media(max-width:768px){body{padding:16px 20px 40px}input{margin-bottom:12px}}
.breadcrumb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);opacity:.6;margin-bottom:22px}
h1{font-family:var(--cond);font-size:36px;font-weight:700;margin-bottom:20px}
input{padding:10px 12px;width:100%;margin-bottom:20px;background:#0a1018;color:var(--text);border:1px solid var(--border);font-family:var(--sans);font-size:14px}
input::placeholder{color:var(--text-faint)}
.card{border:1px solid var(--border);background:linear-gradient(160deg,var(--bg2),var(--bg3));padding:15px 18px;margin-bottom:10px;transition:border-color .15s}
.card:hover{border-color:var(--teal)}
a{color:var(--teal);text-decoration:none}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="artifacts">
<div id="nav-container"></div>

<script>
fetch('components/nav.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('nav-container').innerHTML = html;

    const page = document.body.dataset.page;
    document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  })
  .catch(() => {});
</script>


<div class="breadcrumb">Overview &gt; EA Artifacts</div>
<h1>EA Artifacts</h1>
<input id="search" placeholder="Search artifacts..." onkeyup="filter()">
<div id="list"></div>
<script>
let data=[];
fetch('data/artifacts-index.json').then(r=>r.json()).then(d=>{data=d;render(d)});
function render(items){
  document.getElementById('list').innerHTML = items.map(i=>
    `<div class='card'><a href='${i.detail_page}'><b>${i.title}</b></a><br>${i.summary}</div>`
  ).join('');
}
function filter(){
  let q=document.getElementById('search').value.toLowerCase();
  render(data.filter(i=>JSON.stringify(i).toLowerCase().includes(q)));
}
</script>
</body>
</html>
