<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA Artifacts — Status Site</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--teal:#00C8C8;--bg:#07090F;--bg2:#0D1117;--bg3:#131920;--border:rgba(255,255,255,0.10);--text:#F0F4FA;--text-dim:#B0BFCF;--text-faint:#6A7D90;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--cond:'IBM Plex Sans Condensed',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;width:1100px;margin:0 auto;padding:28px 40px 64px}
.topnav{position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:16px;background:rgba(13,17,23,.96);padding:12px 16px;border:1px solid var(--border);backdrop-filter:blur(6px);margin-bottom:10px}
.topnav-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
.topnav-links{display:flex;gap:10px;flex-wrap:wrap}
.topnav-link{display:inline-block;text-decoration:none;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--border);color:var(--text-dim);background:rgba(255,255,255,0.04)}
.topnav-link:hover{border-color:var(--teal);color:#fff}
.topnav-link.active{border-color:var(--teal);color:var(--teal)}
.breadcrumb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);opacity:.6;margin-bottom:22px}
h1{font-family:var(--cond);font-size:36px;font-weight:700;margin-bottom:20px}
input{padding:10px 12px;width:100%;margin-bottom:20px;background:#0a1018;color:var(--text);border:1px solid var(--border);font-family:var(--sans);font-size:14px}
input::placeholder{color:var(--text-faint)}
.card{border:1px solid var(--border);background:linear-gradient(160deg,var(--bg2),var(--bg3));padding:15px 18px;margin-bottom:10px;transition:border-color .15s}
.card:hover{border-color:var(--teal)}
a{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
<div class="topnav">
  <div class="topnav-label">AI Project Dashboard</div>
  <div class="topnav-links">
    <a class="topnav-link" href="index.html">Dashboard</a>
    <a class="topnav-link" href="decisions.html">Decisions</a>
    <a class="topnav-link" href="scenarios.html">Scenarios</a>
    <a class="topnav-link" href="intelligence.html">Intelligence</a>
    <a class="topnav-link active" href="artifacts.html">Artifacts</a>
    <a class="topnav-link" href="path-architecture.html">Architecture</a>
    <a class="topnav-link" href="control-plane.html">Control Plane</a>
    <a class="topnav-link" href="pptx-builder.html">PPTX</a>
  </div>
</div>
<div class="breadcrumb">Overview &gt; EA Artifacts</div>
<h1>EA Artifacts</h1>
<input id="search" placeholder="Search artifacts..." onkeyup="filter()">
<div id="list"></div>
<script>
let data=[];
fetch('data/artifacts-index.json').then(r=>r.json()).then(d=>{data=d;render(d)});
function render(items){
  document.getElementById('list').innerHTML = items.map(i=>
    `<div class='card'><a href='${i.detail_page}'><b>${i.title}</b></a><br>${i.summary}</div>`
  ).join('');
}
function filter(){
  let q=document.getElementById('search').value.toLowerCase();
  render(data.filter(i=>JSON.stringify(i).toLowerCase().includes(q)));
}
</script>
</body>
</html>
