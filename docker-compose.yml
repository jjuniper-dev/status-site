version: "3.9"

services:
  # Neo4j Graph Database (Enterprise with APOC)
  neo4j:
    image: neo4j:5-enterprise
    container_name: neo4j-graphrag
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/your_password_here
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_maxSize: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "your_password_here", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network

  # FastAPI GraphRAG Service
  graphrag-api:
    build:
      context: .
      dockerfile: services/graphrag-api/Dockerfile
    container_name: graphrag-api
    ports:
      - "8001:8001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: your_password_here
      NEO4J_DATABASE: neo4j
      LLM_MODEL: gpt-4-turbo-preview
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: INFO
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./services/graphrag-api:/app
      - ./neo4j_graphrag_pipeline:/app/neo4j_graphrag_pipeline
      - /tmp/graphrag_uploads:/tmp/graphrag_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/graphrag/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  graphrag-network:
    driver: bridge
