<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligence — AI Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>

<div class="topnav">
  <div class="topnav-label">AI Project Dashboard</div>
  <div class="topnav-links">
    <a class="topnav-link" href="/status-site/index.html">Dashboard</a>
    <a class="topnav-link active" href="/status-site/intelligence.html">Intelligence</a>
  </div>
</div>

<div class="breadcrumb">Dashboard &gt; Intelligence</div>

<div class="header">
  <div class="header-eyebrow">Enterprise AI Intelligence</div>
  <div class="header-title">AI Platform <span>Intelligence</span></div>
  <div class="header-sub">Markdown-driven source of truth</div>
</div>

<div id="intelligence-markdown-root" class="text-block"></div>

<script src="js/markdown-processor.js"></script>
<script src="js/ai-content-reviewer.js"></script>
<script src="js/intelligence-page-renderer.js"></script>
<script src="js/intelligence-editor.js"></script>

<script>
  document.addEventListener('intelligence-source-loaded', (e) => {
    if (!localStorage.getItem('intelligence_draft') && window.intelligenceEditor) {
      window.intelligenceEditor.state.draftContent = e.detail.markdown;
      document.getElementById('editor-textarea').value = e.detail.markdown;
      window.intelligenceEditor.updatePreview();
    }
  });
</script>

</body>
</html>
