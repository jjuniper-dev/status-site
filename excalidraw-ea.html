<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Platform Layering Diagram</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module">
    import { schemaToExcalidraw } from './js/schema-to-excalidraw.js';

    async function loadDiagram() {
      try {
        const response = await fetch('schemas/hcphac-ai-platform-layering.excalidraw.schema.json');
        const schema = await response.json();
        const excalidrawData = schemaToExcalidraw(schema);

        // Store in window for access by Excalidraw
        window.diagramData = excalidrawData;

        // Create download button
        const downloadBtn = document.getElementById('download-btn');
        downloadBtn.onclick = () => {
          const dataStr = JSON.stringify(excalidrawData, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'ai-platform-layering.excalidraw.json';
          a.click();
          URL.revokeObjectURL(url);
        };

        // Render as canvas
        renderDiagramCanvas(excalidrawData, schema);
      } catch (err) {
        console.error('Failed to load diagram:', err);
        document.getElementById('canvas-container').innerHTML = `<p style="color: red;">Error loading diagram: ${err.message}</p>`;
      }
    }

    function renderDiagramCanvas(excalidrawData, schema) {
      const canvas = document.getElementById('diagram-canvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const width = schema.canvas.width;
      const height = schema.canvas.height;

      canvas.width = width;
      canvas.height = height;

      // Fill background
      ctx.fillStyle = schema.canvas.background;
      ctx.fillRect(0, 0, width, height);

      // Draw elements
      excalidrawData.elements.forEach(elem => {
        if (elem.type === 'rectangle') {
          drawRect(ctx, elem);
        } else if (elem.type === 'text') {
          drawText(ctx, elem);
        } else if (elem.type === 'arrow') {
          drawArrow(ctx, elem);
        }
      });
    }

    function drawRect(ctx, elem) {
      const { x, y, width, height, backgroundColor, strokeColor, strokeWidth, text, fontSize } = elem;

      // Draw rectangle
      ctx.fillStyle = backgroundColor || '#ffffff';
      ctx.strokeStyle = strokeColor || '#000000';
      ctx.lineWidth = strokeWidth || 2;
      ctx.fillRect(x, y, width, height);
      ctx.strokeRect(x, y, width, height);

      // Draw text
      if (text) {
        ctx.fillStyle = elem.color || '#000000';
        ctx.font = `${fontSize || 14}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const textX = x + width / 2;
        const textY = y + height / 2;

        // Wrap text if needed
        const words = text.split(' ');
        let line = '';
        let lineY = textY - (fontSize || 14) / 2;

        words.forEach((word, i) => {
          const testLine = line + (line ? ' ' : '') + word;
          const metrics = ctx.measureText(testLine);
          if (metrics.width > width - 10 && line) {
            ctx.fillText(line, textX, lineY);
            line = word;
            lineY += (fontSize || 14) + 2;
          } else {
            line = testLine;
          }
        });
        if (line) {
          ctx.fillText(line, textX, lineY);
        }
      }
    }

    function drawText(ctx, elem) {
      const { x, y, text, fontSize, color } = elem;
      if (!text) return;

      ctx.fillStyle = color || '#000000';
      ctx.font = `${fontSize || 12}px Arial`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(text, x, y);
    }

    function drawArrow(ctx, elem) {
      const { x, y, width, height, strokeColor, strokeWidth, strokeStyle } = elem;
      const toX = x + width;
      const toY = y + height;

      ctx.strokeStyle = strokeColor || '#000000';
      ctx.lineWidth = strokeWidth || 2;

      if (strokeStyle === 'dotted') {
        ctx.setLineDash([5, 5]);
      }

      // Draw line
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.setLineDash([]);

      // Draw arrowhead
      const headlen = 15;
      const angle = Math.atan2(toY - y, toX - x);
      ctx.fillStyle = strokeColor || '#000000';
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    loadDiagram();
  </script>
  <style>
    #canvas-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      background: #f9f9f9;
      padding: 20px;
      margin-top: 20px;
    }
    #diagram-canvas {
      border: 1px solid #ccc;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .diagram-controls {
      margin: 20px 0;
      display: flex;
      gap: 10px;
    }
    .diagram-controls button {
      padding: 8px 16px;
      background: #2F6F73;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .diagram-controls button:hover {
      background: #1F4F53;
    }
  </style>
</head>
<body data-page="diagram-lab">
<div id="nav-container"></div>
<script>
fetch('components/nav.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('nav-container').innerHTML = html;
    const page = document.body.dataset.page;
    document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  })
  .catch(() => {});
</script>
<main class="layout" style="padding: 24px;">
  <h1>AI Platform Layering & Deployment Reality</h1>
  <p>HC/PHAC Enterprise Architecture Interpretation</p>

  <div class="diagram-controls">
    <button id="download-btn">Download as JSON</button>
  </div>

  <div id="canvas-container">
    <canvas id="diagram-canvas"></canvas>
  </div>
</main>
</body>
</html>
