<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">
<div id="nav-container"></div>

<script>
fetch('components/nav.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('nav-container').innerHTML = html;

    const page = document.body.dataset.page;
    document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  })
  .catch(() => {});
</script>



<div class="dashboard">
<div id="nav"></div>
<div id="center"></div>
<div id="right"></div>
</div>

<button id="edit">Edit Active Document</button>

<script src="js/markdown-processor.js"></script>
<script src="js/dashboard-layout-manager.js"></script>
<script src="js/dashboard-renderer.js"></script>
<script src="js/intelligence-editor.js"></script>
<script src="js/dashboard-app.js"></script>
</body>
</html>
